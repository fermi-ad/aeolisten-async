[package]
name = "aeolisten-async"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
redis = { version = "1.2.0", features = [ "aio", "connection-manager", "tokio-comp" ] }
socket2 = "0.6.3"
tokio = { version = "1.51.1", features = [ "full" ] }
